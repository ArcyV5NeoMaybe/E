name: Import source into private NEXORA repository

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CaramelClient fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Push source branch to private NEXORA repository
        env:
          NEXORA_PUSH_TOKEN: ${{ secrets.NEXORA_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NEXORA_PUSH_TOKEN}" ]; then
            echo "Missing repository secret NEXORA_PUSH_TOKEN"
            exit 1
          fi
          TOKEN_USER=$(curl -fsS -H "Authorization: Bearer ${NEXORA_PUSH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/user | jq -r .login)
          echo "Authenticated token account: ${TOKEN_USER}"
          REPO_STATUS=$(curl -sS -o /tmp/nexora-repo.json -w "%{http_code}" -H "Authorization: Bearer ${NEXORA_PUSH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/ArcyV5NeoMaybe/NEXORA-Client-)
          echo "Destination repository access HTTP: ${REPO_STATUS}"
          if [ "${REPO_STATUS}" != "200" ]; then
            jq -r .message /tmp/nexora-repo.json
            exit 1
          fi
          TOKEN_SCOPES=$(curl -sSI -H "Authorization: Bearer ${NEXORA_PUSH_TOKEN}" https://api.github.com/user | tr -d '\r' | awk -F': ' 'tolower($1)=="x-oauth-scopes" {print $2}')
          echo "Token OAuth scopes: ${TOKEN_SCOPES:-not reported}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH_HEADER=$(printf 'x-access-token:%s' "${NEXORA_PUSH_TOKEN}" | base64 -w0)
          DESTINATION="https://github.com/ArcyV5NeoMaybe/NEXORA-Client-.git"
          echo "Checking Git HTTPS access..."
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" ls-remote "${DESTINATION}" HEAD
          echo "Pushing source branch..."
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" push --force "${DESTINATION}" HEAD:refs/heads/upstream/caramelclient
